# Keeps the GitHub Actions in .github/workflows up to date. Minor and patch
# updates come as one PR a week; majors stay separate PRs. Security
# updates also come as one PR.
version: 2
updates:
- package-ecosystem: github-actions
  directory: "/"
  groups:
    actions:
      update-types: [minor, patch]
    # Security updates bundled into one PR, majors included.
    actions-security:
      applies-to: security-updates
      patterns: ["*"]
  schedule:
    interval: weekly
  assignees:
    - grmt
