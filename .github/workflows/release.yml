name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.7)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Plugin ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag and version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package wp-force-password-change.zip
        run: |
          STAGE_DIR="$(mktemp -d)/wp-force-password-change"
          mkdir -p "$STAGE_DIR"
          rsync -a --exclude='.git' --exclude='.github' --exclude='tests' --exclude='node_modules' ./ "$STAGE_DIR/"
          (cd "$(dirname "$STAGE_DIR")" && zip -r "$GITHUB_WORKSPACE/wp-force-password-change.zip" wp-force-password-change)

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" wp-force-password-change.zip --clobber
          else
            gh release create "$TAG" wp-force-password-change.zip \
              --title "wp-force-password-change ${VERSION}" \
              --generate-notes
          fi
